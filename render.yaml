# Existing Render service. Runtime secrets and switches are configured on the service.
# sync:false preserves values on subsequent Blueprint syncs.
services:
  - type: web
    name: pillarspec-whatsapp-receiver
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: pillarspec-events
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /app/data/events.sqlite
      - key: ALLOWED_PHONE_NUMBER_ID
        value: '1367620946438403'
      - key: RETENTION_DAYS
        value: '30'
      - key: OWNER_PHONE_NUMBER
        value: '+96176868315'
      - key: MAX_REPLIES_PER_HOUR
        value: '20'
      - key: MAX_OWNER_REPLIES_PER_HOUR
        value: '120'
      - key: MAX_AI_CALLS_PER_DAY
        value: '300'
      - key: META_GRAPH_VERSION
        value: 'v23.0'
      - key: OUTBOUND_ENABLED
        sync: false
      - key: AUTO_REPLY_ENABLED
        sync: false
      - key: AI_ENABLED
        sync: false
      - key: RESEARCH_ENABLED
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: INBOX_API_TOKEN
        generateValue: true
